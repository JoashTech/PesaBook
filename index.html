<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f7a4a">
<title>PesaBook</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<style>:root{--bg:#f3f6f4;--fg:#13201a;--mut:#64746b;--card:#fff;--line:#e1e8e3;--pri:#0f7a4a;--priD:#0a5a37;--priT:#fff;--in:#0f7a4a;--out:#c2410c;--tip:#e8f5ee;--shadow:0 1px 2px rgba(16,40,28,.06),0 6px 18px rgba(16,40,28,.06)}
@media (prefers-color-scheme:dark){:root{--bg:#0d1310;--fg:#e8f0ec;--mut:#93a39a;--card:#16201b;--line:#25312a;--pri:#2fbf80;--priD:#16694a;--priT:#06150d;--in:#43d492;--out:#ff8a5c;--tip:#15291f;--shadow:0 1px 2px rgba(0,0,0,.4)}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding-bottom:96px}
header{position:sticky;top:0;z-index:5;background:var(--bg);display:flex;align-items:center;justify-content:space-between;padding:12px 16px;border-bottom:1px solid var(--line)}
header h1{font-size:18px;margin:0;letter-spacing:-.2px;color:var(--pri)}
header small{display:block;color:var(--mut);font-size:12px}
header button{background:var(--card);border:1px solid var(--line);color:var(--fg);width:38px;height:38px;border-radius:12px;font-size:18px}
main{padding:14px 16px;max-width:620px;margin:0 auto}
h3{margin:24px 0 8px;font-size:15px}
.muted{color:var(--mut);font-size:14px}
label{display:block;font-size:13px;color:var(--mut);margin:12px 0}
input,select,textarea{display:block;width:100%;margin-top:5px;padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--fg);font:inherit}
input:focus,select:focus,textarea:focus{outline:2px solid var(--pri);outline-offset:0}
textarea{resize:vertical}
.search{margin:10px 0}
.hello{margin:2px 0 10px}.hello small{display:block;color:var(--mut)}.hello b{font-size:22px;letter-spacing:-.3px}
.seg{display:flex;gap:6px;margin-bottom:12px;background:var(--card);padding:4px;border-radius:14px;border:1px solid var(--line)}
.seg button{flex:1;padding:9px 4px;border:0;border-radius:10px;background:transparent;color:var(--mut);font:inherit;font-size:14px}
.seg button.on{background:var(--pri);color:var(--priT);font-weight:600}
.seg button.on.out{background:var(--out);color:#fff}
.hero{background:linear-gradient(135deg,var(--pri),var(--priD));color:#fff;border-radius:20px;padding:18px;box-shadow:var(--shadow)}
.hero small{opacity:.85;font-size:13px}
.hero .big{font-size:34px;font-weight:700;letter-spacing:-.8px;margin:2px 0 14px}
.hero .big.neg{color:#ffd9c9}
.hrow{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.hrow>div{background:rgba(255,255,255,.14);border-radius:14px;padding:10px 12px}
.hrow small{display:block;font-size:12px}.hrow b{font-size:16px}
.banner{margin:12px 0 0;background:var(--tip);border:1px dashed var(--pri);border-radius:12px;padding:10px 12px;font-size:13px;display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.banner button{border:0;background:var(--pri);color:var(--priT);border-radius:8px;padding:6px 10px;font:inherit;font-size:12px}
.qa{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0}
.qa button{padding:14px;border-radius:14px;border:1px solid var(--line);background:var(--card);font:inherit;font-weight:600;box-shadow:var(--shadow)}
.qa .in{color:var(--in)}.qa .out{color:var(--out)}
.panel{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin:12px 0;box-shadow:var(--shadow)}
.panel h4{margin:0 0 8px;font-size:14px}
.panel svg{width:100%;height:auto;display:block}
.axis{stroke:var(--line);stroke-width:1}
.b-in{fill:var(--in)}.b-out{fill:var(--out)}
.lbl{fill:var(--mut);font-size:9.5px}
.legend{display:flex;gap:14px;font-size:12px;color:var(--mut);margin-top:6px;flex-wrap:wrap;align-items:center}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;background:var(--in)}.legend i.out{background:var(--out)}
.legend em{margin-left:auto;font-style:normal}
.tipbox{background:var(--tip);border-color:transparent}
.tipbox ul{margin:0 0 8px;padding-left:18px;font-size:14px}.tipbox li{margin:5px 0}
.owed{width:100%;text-align:left;padding:13px;border-radius:14px;border:1px solid var(--line);background:var(--card);color:var(--fg);font:inherit;font-size:14px;box-shadow:var(--shadow)}
.bar{position:relative;display:flex;justify-content:space-between;align-items:center;margin:6px 0;font-size:13px;height:32px;background:var(--card);border:1px solid var(--line);border-radius:10px;overflow:hidden;padding:0 10px}
.bar i{position:absolute;left:0;top:0;bottom:0;background:var(--out);opacity:.16}
.bar span,.bar em{position:relative;font-style:normal}
.row{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:11px 13px;margin:7px 0;flex-wrap:wrap}
.rl{flex:1;min-width:0}.rl b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.rl small{color:var(--mut);font-size:12px}
.amt{font-weight:600;font-size:15px;white-space:nowrap}.amt.in{color:var(--in)}.amt.out{color:var(--out)}
.x{border:0;background:transparent;color:var(--mut);font-size:16px;padding:4px 6px}
.acts{display:flex;gap:6px;width:100%;justify-content:flex-end}
.acts button,.acts a{border:1px solid var(--line);background:var(--bg);color:var(--fg);border-radius:9px;padding:7px 13px;font:inherit;font-size:13px;text-decoration:none}
.btn{display:block;width:100%;margin:12px 0 0;padding:14px;border:0;border-radius:14px;background:var(--pri);color:var(--priT);font:inherit;font-weight:600}
.btn.alt{background:var(--card);color:var(--fg);border:1px solid var(--line)}
.btn.danger{background:transparent;color:var(--out);border:1px solid var(--out)}
.btn.sm{padding:10px;font-size:14px;margin-top:6px}
.file input{margin-top:8px}
.qbox h4{margin-bottom:10px}
.qrow{display:flex;gap:8px}.qrow input{margin:0;flex:1;min-width:0}
.mic,.go{border:0;border-radius:12px;font:inherit;padding:0 14px}
.mic{background:var(--tip);font-size:20px;color:var(--pri)}.mic.live{background:var(--out);color:#fff;animation:pulse 1s infinite}
.go{background:var(--pri);color:var(--priT);font-weight:600}
@keyframes pulse{50%{opacity:.55}}
.pv{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:11px;margin:8px 0}
.pv small{color:var(--mut);display:block;margin:4px 0 8px}
.chk{display:flex;gap:8px;align-items:center;margin:0;color:var(--fg);font-size:15px}
.chk input{width:auto;margin:0}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}.two select{margin:0}
.report{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;white-space:pre-wrap;font:14px/1.5 ui-monospace,Menlo,monospace}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;align-items:flex-end;background:var(--card);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom))}
nav button{flex:1;border:0;background:transparent;color:var(--mut);padding:4px 0;font:inherit;display:flex;flex-direction:column;align-items:center;gap:2px}
nav button svg{width:24px;height:24px}
nav button em{font-style:normal;font-size:11px}
nav button.on{color:var(--pri);font-weight:600}
nav button.fab b{display:grid;place-items:center;width:52px;height:52px;margin-top:-26px;border-radius:50%;background:var(--pri);color:var(--priT);box-shadow:0 6px 16px rgba(15,122,74,.4)}
nav button.fab svg{width:26px;height:26px}
#toast{position:fixed;left:50%;bottom:100px;transform:translateX(-50%) translateY(20px);background:#111;color:#fff;padding:10px 16px;border-radius:20px;font-size:14px;opacity:0;pointer-events:none;transition:.25s;max-width:90%;text-align:center;z-index:30}
#toast.show{opacity:1;transform:translateX(-50%)}
.onb header,.onb nav{display:none}
.onb body,body.onb{padding-bottom:24px;background:linear-gradient(180deg,var(--pri),var(--priD) 260px,var(--bg) 260px)}
.ob{text-align:center;color:var(--fg)}
.ob .logo{width:72px;height:72px;margin:10px auto 8px}.ob .logo svg{width:100%;height:100%}
.ob h1{margin:0;font-size:26px;color:#fff;letter-spacing:-.4px}
.ob>p{color:rgba(255,255,255,.88);margin:6px 8px 22px;font-size:15px}
.obcard{background:var(--card);border-radius:20px;padding:16px;text-align:left;box-shadow:var(--shadow)}
.obcard>label:first-child{margin-top:0}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chips button{flex:1;min-width:84px;padding:10px 8px;border:1px solid var(--line);background:var(--bg);color:var(--fg);border-radius:12px;font:inherit;font-size:14px}
.chips button.on{background:var(--pri);color:var(--priT);border-color:var(--pri);font-weight:600}
.chips.types button span{display:block;font-size:22px}
#lock{position:fixed;inset:0;z-index:50;background:linear-gradient(180deg,var(--pri),var(--priD));display:grid;place-items:center;color:#fff}
#lock[hidden]{display:none}
.lk{text-align:center;width:min(320px,90vw)}
.lk .lg{font-size:40px}.lk h2{margin:6px 0 14px}
.dots{display:flex;gap:14px;justify-content:center;margin-bottom:8px}
.dots i{width:14px;height:14px;border-radius:50%;border:2px solid #fff;display:block}.dots i.f{background:#fff}
.dots.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.lmsg{min-height:22px;margin:0 0 8px;font-size:14px}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:8px 0}
.pad button{width:72px;height:72px;margin:0 auto;border-radius:50%;border:0;background:rgba(255,255,255,.18);color:#fff;font:600 24px system-ui}
.pad button:active{background:rgba(255,255,255,.35)}
.lnk{background:transparent;border:0;color:#fff;opacity:.85;text-decoration:underline;margin-top:10px;font:inherit}
body.locked main,body.locked nav,body.locked header{visibility:hidden}
@media print{header,nav,.noprint,#toast,#lock{display:none!important}body{background:#fff;color:#000;padding:0}.report{border:0;font-size:13pt}}
</style>
</head>

/* ---------- categoriser (keyword rules, works offline, free) ---------- */
function guessCategory(type, text) {

  if (/airtime|\bdata\b|bundle/.test(t0)) return 'Airtime & Data';
  if (/\brent\b|\bkodi\b/.test(t0)) return 'Rent';
  if (/repair|spare|garage|mechanic|service the/.test(t0)) return 'Repairs';
  if (/seed|fertili[sz]er|\bfeed\b|\bvet\b|pesticide|pembejeo/.test(t0)) return 'Farm inputs';
  if (/transport|fuel|boda|taxi|uber|safeboda|bolt|petrol|matatu|diesel/.test(t0)) return 'Transport';
  if (/salary|wage|staff|worker|labou?r|mshahara/.test(t0)) return 'Salaries';
  if (/umeme|yaka|nwsc|water|electric|power|internet|wifi/.test(t0)) return 'Utilities';
  if (/stock|goods|suppl|wholesale|restock|inventory|bidhaa/.test(t0)) return 'Stock & Supplies';
  if (/lunch|food|meal|restaurant|chakula/.test(t0)) return 'Food';
  if (/withdraw|cash[- ]?out/.test(t0)) return 'Withdrawal';

/* ---------- mobile money SMS parser ---------- */
const END = '(?=\\s*[\\(\\[]|\\s+\\+?\\d{6,}|\\s+(?:on|at|for|Ref|TID|Txn|Trans|Fee|Charge|Bal|New|Your|via|using)\\b|[.,;]|$)';

}
function parseSms(raw) {
  const s = String(raw).replace(/\s+/g, ' ').trim();
  const A = '([\\d][\\d,]*(?:\\.\\d+)?)';
  const m = s.match(new RegExp(CUR_RE + '\\.?\\s*' + A, 'i')) || s.match(new RegExp(A + '\\s*' + CUR_RE, 'i'));
  if (!m) return null;

  if (!(amount > 0)) return null;
  const inRe = /(received|credited|deposited|cash[- ]?in)/i;
  const outRe = /(\bsent\b|\bpaid\b|payment of|transferred|withdr[ae]w|bought|purchased|debited|cash[- ]?out)/i;
  const i = s.search(inRe), o = s.search(outRe);
  let type, guess = false;
  if (i >= 0 && (o < 0 || i < o)) type = 'in';
  else if (o >= 0) type = 'out';
  else { type = 'out'; guess = true; }
  const pm = s.match(new RegExp('\\b' + (type === 'in' ? 'from' : 'to') + '\\s+(.{2,40}?)' + END, 'i'));
  const party = pm ? pm[1].replace(/[\s\d+]+$/, '').trim() : '';
  let ref = '';
  const rm = s.match(/(?:TID|Txn ?ID|Transaction ?ID|Trans ?ID|Ref(?:erence)?(?: ?No)?|Financial Transaction Id)\s*[:#.]?\s*([A-Z0-9-]{6,})/i);
  if (rm && /\d/.test(rm[1])) ref = rm[1].toUpperCase();
  const fm = s.match(new RegExp('(?:fee|charges?)\\s*(?:of|:|is)?\\s*(?:' + CUR_RE + ')?\\s*\\.?\\s*([\\d][\\d,]*)', 'i'));
  const bm = s.match(new RegExp('(?:balance|bal)\\s*(?:is|:)?\\s*(?:' + CUR_RE + ')?\\s*\\.?\\s*([\\d][\\d,]*)', 'i'));
  return {
    type, guess, amount, party, ref,
    fee: fm ? num(fm[1]) : 0,
    balance: bm ? num(bm[1]) : null,
    date: parseDate(s) || today(),
    category: guessCategory(type, s.replace(new RegExp('\\b(?:fee|charges?)\\b\\s*(?:of|:|is)?\\s*(?:' + CUR_RE + ')?\\s*[\\d,.]*', 'ig'), ' ')),
    raw: s

}
function splitSms(text) {
  let parts = String(text).split(/\n\s*\n/).map(x => x.trim()).filter(Boolean);
  if (parts.length === 1) {
    const lines = parts[0].split('\n').map(x => x.trim()).filter(Boolean);
    if (lines.length > 1 && lines.every(l => new RegExp(CUR_RE, 'i').test(l))) parts = lines;
  }

}

/* ---------- quick entry / voice sentence parser ---------- */
const W1 = { zero: 0, one: 1, two: 2, three: 3, four: 4, five: 5, six: 6, seven: 7, eight: 8, nine: 9, ten: 10, eleven: 11, twelve: 12, thirteen: 13, fourteen: 14, fifteen: 15, sixteen: 16, seventeen: 17, eighteen: 18, nineteen: 19, twenty: 20, thirty: 30, forty: 40, fifty: 50, sixty: 60, seventy: 70, eighty: 80, ninety: 90 };
const has = (o, k) => Object.prototype.hasOwnProperty.call(o, k);
function wordsAmount(s) {
  const toks = s.replace(/-/g, ' ').split(/[^a-z]+/).filter(Boolean);
  let best = 0, total = 0, cur = 0, run = false;
  const flush = () => { if (run) best = Math.max(best, total + cur); total = 0; cur = 0; run = false; };
  for (const w of toks) {

    else if (w === 'hundred') { cur = (cur || 1) * 100; run = true; }
    else if (w === 'thousand') { total += (cur || 1) * 1000; cur = 0; run = true; }
    else if (w === 'million') { total += (cur || 1) * 1e6; cur = 0; run = true; }

}

const IN_W = /\b(sold|sell|sale|sales|received|receive|got|earned|income|nimeuza|nimepokea|nimepata|umeuza|tumeuza|tumepata)\b/i;

function parseQuick(text) {

  if (/\bpaid (me|us)\b/i.test(raw)) type = 'in';
  else {
    const i = raw.search(IN_W), o = raw.search(OUT_W);

    .replace(/\b(ugx|ush|kes|tsh|rwf|ghs|ngn|shillings?|shs?|sh|hundred|thousand|million|and)\b/gi, ' ')

/* ---------- numbers & periods ---------- */
function totals(list) {
  let inc = 0, exp = 0;
  for (const x of list) { if (x.type === 'in') inc += x.amount; else exp += x.amount; }
  return { inc, exp, profit: inc - exp };
}
function range(period) {
  const d = today();
  if (period === 'today') return [d, d];
  if (period === 'week') return [addDays(d, -6), d];
  if (period === 'month') return [d.slice(0, 8) + '01', d];

}
function prevRange(period) {
  const d = today();
  if (period === 'today') { const y = addDays(d, -1); return [y, y]; }
  if (period === 'week') return [addDays(d, -13), addDays(d, -7)];
  if (period === 'month') {
    const [y, m] = d.split('-').map(Number), day = Number(d.slice(8));
    const first = new Date(y, m - 2, 1), last = new Date(y, m - 1, 0);

function inPeriod(tx, period) { const [a, b] = range(period); return tx.filter(x => x.date >= a && x.date <= b); }

/* ---------- smart insights ---------- */
function bestDay(tx) {
  const byDate = {};
  tx.forEach(x => { if (x.type === 'in') byDate[x.date] = (byDate[x.date] || 0) + x.amount; });
  const dates = Object.keys(byDate);
  if (dates.length < 7) return null;
  const sum = Array(7).fill(0), cnt = Array(7).fill(0);
  dates.forEach(d => { const w = weekday(d); sum[w] += byDate[d]; cnt[w]++; });
  const avg = sum.map((v, i) => cnt[i] ? v / cnt[i] : 0);
  const used = avg.filter((v, i) => cnt[i] > 0);
  if (used.length < 3) return null;
  const mean = used.reduce((a, b) => a + b, 0) / used.length;
  let bi = 0; avg.forEach((v, i) => { if (v > avg[bi]) bi = i; });
  return avg[bi] >= mean * 1.15 ? bi : null;
}
function insights(tx, period) {
  if (!tx.length) return [t('ins_empty')];
  const cur = inPeriod(tx, period), c = totals(cur), out = [];
  if (!cur.length) return [t(period === 'today' ? 'ins_notoday' : 'ins_none')];
  const pr = prevRange(period);
  const prev = pr ? tx.filter(x => x.date >= pr[0] && x.date <= pr[1]) : [];
  if (pr) {
    const p = totals(prev);
    if (p.inc > 0) {
      const ch = Math.round((c.inc - p.inc) / p.inc * 100), lab = t({ today: 'cmp_today', week: 'cmp_week', month: 'cmp_month' }[period]);
      out.push(ch === 0 ? t('ins_same', lab) : t(ch > 0 ? 'ins_up' : 'ins_down', Math.abs(ch), lab));
    }
  }
  const bd = bestDay(tx);
  if (bd !== null) out.push(t('ins_best', t('days')[bd]));
  const cc = sumByCat(cur), top = Object.entries(cc).sort((a, b) => b[1] - a[1])[0];
  if (top && c.exp > 0) out.push(t('ins_topcost', catLabel(top[0]), Math.round(top[1] / c.exp * 100)));
  if (top && pr) {
    const pv = sumByCat(prev)[top[0]];
    if (pv > 0) { const ch = Math.round((top[1] - pv) / pv * 100); if (ch >= 25) out.push(t('ins_catup', ch, catLabel(top[0]))); }
  }
  if (c.inc > 0) out.push(c.profit >= 0 ? t('ins_keep', Math.round(c.profit / c.inc * 100)) : t('ins_loss'));

}

}

/* ---------- chart data + SVG ---------- */
function chartData(tx, period) {
  const d = today(); let dates = [];
  if (period === 'month') { const first = d.slice(0, 8) + '01'; for (let x = first; x <= d; x = addDays(x, 1)) dates.push(x); }
  else for (let i = 6; i >= 0; i--) dates.push(addDays(d, -i));
  return dates.map(date => {
    let inc = 0, exp = 0;
    tx.forEach(x => { if (x.date === date) { if (x.type === 'in') inc += x.amount; else exp += x.amount; } });
    return { date, inc, exp };
  });
}

  const max = Math.max(1, ...data.map(d => Math.max(d.inc, d.exp)));
  const gw = (W - pl * 2) / n, bw = Math.max(3, Math.min(14, gw / 2 - 1.5)), ph = H - pb - pt;
  const month = n > 8;
  let g = '<line x1="0" x2="' + W + '" y1="' + (H - pb) + '" y2="' + (H - pb) + '" class="axis"/>';
  data.forEach((d, i) => {
    const cx = pl + gw * i + gw / 2, hi = d.inc / max * ph, ho = d.exp / max * ph, w = weekday(d.date);
    const tip = d.date + ' · ' + t('mIn') + ' ' + fmtFn(d.inc) + ' · ' + t('mOut') + ' ' + fmtFn(d.exp);
    g += '<g><title>' + esc(tip) + '</title>' +
      '<rect class="b-in" x="' + (cx - bw - 0.5).toFixed(1) + '" y="' + (H - pb - hi).toFixed(1) + '" width="' + bw.toFixed(1) + '" height="' + Math.max(hi, d.inc ? 1.5 : 0).toFixed(1) + '" rx="2"/>' +
      '<rect class="b-out" x="' + (cx + 0.5).toFixed(1) + '" y="' + (H - pb - ho).toFixed(1) + '" width="' + bw.toFixed(1) + '" height="' + Math.max(ho, d.exp ? 1.5 : 0).toFixed(1) + '" rx="2"/></g>';
    const lab = month ? ((+d.date.slice(8)) % 5 === 0 || i === 0 ? String(+d.date.slice(8)) : '') : t('dayS')[w];

  });
  return '<svg viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="' + esc(t('chart')) + '">' + g + '</svg>';
}

/* ---------- PIN lock ---------- */
async function hashPin(pin) {
  const salt = 'pesabook:';
  try {
    const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(salt + pin));
    return Array.from(new Uint8Array(b)).map(x => x.toString(16).padStart(2, '0')).join('');
  } catch (e) { let h = 5381; for (const ch of salt + pin) h = ((h << 5) + h + ch.charCodeAt(0)) | 0; return 'f' + h; }
}
const lock = { buf: '', fails: 0, until: 0 };
function drawLock(msg) {
  const el = $('#lock');
  el.innerHTML = '<div class="lk"><div class="lg">🔒</div><h2>' + esc(t('lockTitle')) + '</h2><div class="dots">' +
    [0, 1, 2, 3].map(i => '<i class="' + (i < lock.buf.length ? 'f' : '') + '"></i>').join('') + '</div><p class="lmsg">' + esc(msg || '') + '</p><div class="pad">' +
    ['1', '2', '3', '4', '5', '6', '7', '8', '9', '', '0', '⌫'].map(k => k === '' ? '<span></span>' : '<button data-act="pinkey" data-v="' + k + '">' + k + '</button>').join('') +
    '</div><button class="lnk" data-act="forgot">' + esc(t('forgot')) + '</button></div>';
}
function showLock() { lock.buf = ''; $('#lock').hidden = false; document.body.classList.add('locked'); drawLock(''); }
function hideLock() { $('#lock').hidden = true; document.body.classList.remove('locked'); }
async function pinKey(k) {
  const wait = Math.ceil((lock.until - Date.now()) / 1000);
  if (wait > 0) return drawLock(t('lockWait', wait));
  if (k === '⌫') lock.buf = lock.buf.slice(0, -1);
  else if (lock.buf.length < 4) lock.buf += k;
  if (lock.buf.length < 4) return drawLock('');
  const ok = (await hashPin(lock.buf)) === S.settings.pin;
  lock.buf = '';
  if (ok) { lock.fails = 0; hideLock(); return; }
  lock.fails++;
  if (lock.fails >= 5) { lock.fails = 0; lock.until = Date.now() + 30000; return drawLock(t('lockWait', 30)); }
  drawLock(t('lockWrong'));
  const d = document.querySelector('.dots'); if (d) { d.classList.add('shake'); }
}

function startVoice() {

  r.lang = { en: 'en-UG', sw: 'sw-KE', lg: 'en-UG' }[S.settings.lang] || 'en-UG';
  r.interimResults = false; r.maxAlternatives = 1;

    if (!confirm(t('paid') + '?')) return;
    d.paid = true;
    S.tx.push({ id: uid(), c: Date.now(), type: d.dir === 'owed' ? 'in' : 'out', amount: d.amount, party: d.party, note: d.note || 'Debt settled', category: d.dir === 'owed' ? 'Debt payment' : 'Other', date: today(), src: d.sample ? 'sample' : 'debt' });
    save(); render();
  },
  debtdel(el) { if (confirm('✕?')) { S.debts = S.debts.filter(x => x.id !== el.dataset.id); save(); render(); } },
  rwa() { window.open('https://wa.me/?text=' + encodeURIComponent(reportText(ui.rPeriod)), '_blank'); },
  rwa_today() { window.open('https://wa.me/?text=' + encodeURIComponent(reportText('today')), '_blank'); },
  rcopy() { navigator.clipboard.writeText(reportText(ui.rPeriod)).then(() => toast(t('copied')), () => toast('Could not copy')); },
  rcsv() { download('pesabook-' + ui.rPeriod + '-' + today() + '.csv', csvText(), 'text/csv'); },
  rprint() { window.print(); },
  ssave() {
    S.settings.biz = $('#s_biz').value.trim() || 'My Business';
    S.settings.cur = $('#s_cur').value.trim() || 'UGX';
    S.settings.cc = ($('#s_cc').value.replace(/\D/g, '')) || '256';
    S.settings.lang = $('#s_lang').value;
    save(); render(); toast(t('settingsSaved'));
  },
  async pinset() {
    const v = $('#s_pin').value.trim();
    if (!/^\d{4}$/.test(v)) return toast(t('pinBad'));
    S.settings.pin = await hashPin(v); save(); render(); toast(t('pinSaved'));
  },
  async pinremove() {
    const v = prompt(t('pinCurrent')); if (v === null) return;
    if ((await hashPin(v.trim())) !== S.settings.pin) return toast(t('lockWrong'));
    S.settings.pin = null; save(); render(); toast(t('pinRemoved'));
  },
  pinkey(el) { pinKey(el.dataset.v); },
  forgot() {
    if (!confirm(t('forgotConfirm'))) return;
    S = DEFAULT(); save(); hideLock(); ui.tab = 'home'; render();
  },
  backup() { const copy = JSON.parse(JSON.stringify(S)); copy.settings.pin = null; download('pesabook-backup-' + today() + '.json', JSON.stringify(copy), 'application/json'); },
  clearsample() {
    if (!confirm(t('clearSample') + '?')) return;
    S.tx = S.tx.filter(x => x.src !== 'sample'); S.debts = S.debts.filter(d => !d.sample);
    save(); render(); toast(t('sampleCleared'));
  },
  wipe() { if (confirm(t('wipe') + '?') && confirm(t('wipe') + '? (2/2)')) { S = DEFAULT(); save(); ui.tab = 'home'; render(); } },
  oblang(el) { ui.ob.biz = $('#ob_biz').value; ui.ob.cur = $('#ob_cur').value; ui.ob.lang = el.dataset.v; S.settings.lang = el.dataset.v; render(); },
  obtype(el) { ui.ob.biz = $('#ob_biz').value; ui.ob.cur = $('#ob_cur').value; ui.ob.type = el.dataset.v; render(); },
  obfinish(el) { finishOnboard(el.dataset.v); }
};

function init() {
  load();
  ui.ob.lang = S.settings.lang; ui.ob.cur = S.settings.cur;
  document.addEventListener('click', e => {
    const el = e.target.closest('[data-act]'); if (!el) return;
    if (ACT[el.dataset.act]) ACT[el.dataset.act](el);
  });
  document.addEventListener('keydown', e => { if (e.key === 'Enter' && e.target.id === 'q_in') { e.preventDefault(); ACT.fill(); } });
  document.addEventListener('input', e => {
    if (e.target.id === 'h_q') { ui.hQuery = e.target.value; $('#hlist').innerHTML = histList(S.tx.filter(matchTx).sort(byNewest)); }
  });
  document.addEventListener('change', e => {
    const el = e.target, k = el.dataset && el.dataset.pv;
    if (k && ui.preview) {
      const it = ui.preview[+el.dataset.i];
      if (k === 'chk') it.on = el.checked;
      if (k === 'type') { it.p.type = el.value; it.p.guess = false; it.p.category = guessCategory(el.value, it.p.raw); renderPreview(); }
      if (k === 'cat') it.p.category = el.value;
    }
    if (el.id === 'f_restore' && el.files[0]) {
      const r = new FileReader();
      r.onload = () => {
        try {
          const o = JSON.parse(r.result); if (!Array.isArray(o.tx)) throw 0;
          const keepPin = S.settings.pin;
          S = Object.assign(DEFAULT(), o); S.settings = Object.assign(DEFAULT().settings, o.settings || {}, { pin: keepPin, onboarded: true });
          save(); render(); toast(t('restored'));
        } catch (x) { toast(t('badBackup')); }
      };
      r.readAsText(el.files[0]);
    }
  });
  let hiddenAt = 0;
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) hiddenAt = Date.now();
    else if (S.settings.pin && hiddenAt && Date.now() - hiddenAt > 60000) showLock();
  });
  render();
  if (S.settings.pin && S.settings.onboarded) showLock();
  if ('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('sw.js').catch(() => { });
}
if (typeof document !== 'undefined') init();
if (typeof module !== 'undefined') module.exports = { parseSms, splitSms, parseQuick, amountFrom, guessCategory, totals, insights, insight, inPeriod, bestDay, chartData, chartSvg, sampleData, owedInfo, t, S: () => S, setTx: v => { S.tx = v; }, setLang: l => { S.settings.lang = l; } };
</script>
